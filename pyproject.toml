[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "term5-local"
version = "6.2.0+ui4"
description = "term_6 v6.2-ui4 modern spatial workspace — compact icon navigation, collision-aware projects and uncapped Project Owners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.40"]
license = {text = "Proprietary"}
authors = [{name = "term_5 project"}]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.50"]

[project.scripts]
term5 = "term5.cli:main"
term6 = "term5.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["term5*"]

[tool.setuptools.package-data]
"term5.skills" = ["bundled/*/*/manifest.json"]
